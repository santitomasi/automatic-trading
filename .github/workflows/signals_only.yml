name: Señales Diarias (paralelo)

on:
  schedule:
    - cron: '15 22 * * 1-5'   # automatico: al cierre de EEUU (dias habiles)
  workflow_dispatch:           # manual: dispáralo cuando quieras desde Actions

permissions:
  contents: write

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy tzdata

      - name: Correr el feed de señales
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SIGNALS: ${{ secrets.TELEGRAM_CHAT_ID_SIGNALS }}
          # scheduled si lo dispara el cron; manual si lo disparas vos a mano
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: python signals_only.py

      - name: Guardar el estado de señales
        run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash 2>/dev/null || true
          git add signals_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar hoy."
          else
            git commit -m "Estado señales $(date -u +%Y-%m-%d)"
            git push
          fi
